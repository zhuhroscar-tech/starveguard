[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "starveguard"
version = "0.1.2"
description = "Simulate and audit priority-queue scheduling policies for preemption starvation (the vLLM #41951 bug class)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
starveguard = "starveguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
